<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 140px;
        }

        input[type="number"] {
            padding: 5px;
            width: 120px;
        }

        button {
            padding: 6px 12px;
            margin-top: 10px;
            margin-right: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #333;
            width: 320px;
            display: none;
            background-color: #f9f9f9;
        }

        .skenario-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #aaa;
        }
    </style>
</head>

<body>
    <h2>Mini Project — Kalkulator Nilai Mahasiswa</h2>
    <p>Masukkan nilai tugas (30%), UTS (30%), dan UAS (40%) dalam rentang 0–100.</p>

    <div class="form-group">
        <label for="tugas">Nilai Tugas (30%):</label>
        <input type="number" id="tugas" min="0" max="100" placeholder="0 - 100">
    </div>

    <div class="form-group">
        <label for="uts">Nilai UTS (30%):</label>
        <input type="number" id="uts" min="0" max="100" placeholder="0 - 100">
    </div>

    <div class="form-group">
        <label for="uas">Nilai UAS (40%):</label>
        <input type="number" id="uas" min="0" max="100" placeholder="0 - 100">
    </div>

    <button type="button" onclick="prosesHitung()">Hitung Nilai</button>
    <button type="button" onclick="resetForm()">Reset</button>

    <p id="pesanError" class="error"></p>

    <div id="hasil">
        <h3>Hasil Perhitungan:</h3>
        <p>Nilai Akhir: <strong id="nilaiAkhir">-</strong></p>
        <p>Predikat: <strong id="predikat">-</strong></p>
        <p>Status: <strong id="status">-</strong></p>
    </div>

    <div class="skenario-box">
        <h3>Uji Skenario Nilai:</h3>
        <button type="button" onclick="ujiSkenario(85, 78, 88)">Skenario 1 (85, 78, 88)</button>
        <button type="button" onclick="ujiSkenario(90, 85, 90)">Skenario 2 (90, 85, 90)</button>
        <button type="button" onclick="ujiSkenario(50, 45, 55)">Skenario 3 (50, 45, 55)</button>
    </div>

    <p style="margin-top: 25px;"><a href="index.html">&larr; Kembali ke index.html</a></p>

    <script src="kalkulator_nilai.js"></script>
</body>

</html>
